<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azumanga Daioh Advance</title>

    <!-- Required Styles & Core Scripts -->
    <link rel="stylesheet" type="text/css" href="https://nesninja.com/assets/js/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="https://nesninja.com/assets/css/style.css?v=28">
    <script src="https://nesninja.com/assets/js/jquery-1.7.2.min.js"></script>
    <script src="https://nesninja.com/assets/js/scripts.js?v=22"></script>

    <!-- Emulator Configuration Variables -->
    <script type="text/javascript">
      var gameName = "azumanga-daioh-advance";
      var allConsoles = ['nes','snes','sega','gbx','gba','sms','a26','a78','gg','jag','lnx','wsx','dos'];
      var emulators = [];
      emulators['gba'] = ['emulatorjsa','emulatorjs','emurom','neptunjs'];
    </script>

    <style>
      body {
        background-color: #000;
        color: #fff;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #gameBox {
        width: 640px;
        height: 480px;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .tabs-below {
        margin-top: 10px;
        width: 640px;
      }
    </style>
  </head>
  <body>

    <!-- Emulator Container -->
    <div id="gameBox">
      <div id="gamePreload">
        <div id="skipPreloadFrame" style="display:block;">
          <a href="#" class="biglink" onclick="skipPreload();return false;"> </a>
        </div>
        <div id="gamePreloadProgress" class="progress progress-success progress-striped" style="margin: 9px;">
          <div class="bar" style="width: 0%;"></div>
        </div>
        <div style="margin: 9px; text-align: center;">
          Loading game "Azumanga Daioh Advance (J) [T+Chi].gba", please wait...<br>
          <a id="skipPreloadButton" href="#" onclick="skipPreload();return false;">Press here to show the game</a>
        </div>
      </div>

      <iframe data-src="https://nesninja.com/gameframe_gba_emulatorjsa.php?file=Azumanga%20Daioh%20Advance%20%28J%29%20%5BT%2BChi%5D.gba"
              data-rom="Azumanga%20Daioh%20Advance%20%28J%29%20%5BT%2BChi%5D.gba"
              width="640" height="480"
              frameborder="0" id="gameFrame"
              name="gameFrame" scrolling="no"
              style="display:none;overflow:hidden;width:640px;height:480px;"></iframe>
    </div>

    <!-- Emulator Switcher Tabs -->
    <div class="tabs-below">
      <ul class="nav nav-tabs">
        <li class="emulator_emulatorjsa active">
          <a href="#" onclick="return pickEmulator('gba','emulatorjsa',this,gameName);">EmuJS(Stable) (+Saves)</a>
        </li>
        <li class="emulator_emulatorjs">
          <a href="#" onclick="return pickEmulator('gba','emulatorjs',this,gameName);">EmuJS(Beta) (+Saves)</a>
        </li>
        <li class="emulator_emurom">
          <a href="#" onclick="return pickEmulator('gba','emurom',this,gameName);">Emurom</a>
        </li>
        <li class="emulator_neptunjs">
          <a href="#" onclick="return pickEmulator('gba','neptunjs',this,gameName);">NeptunJS (+Saves)</a>
        </li>
      </ul>
    </div>

  </body>
</html>
