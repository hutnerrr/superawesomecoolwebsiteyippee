    <style>
      body {
        background-color: #000;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      :-webkit-full-screen {
        position: fixed;
        left: 0;
        top: 0;
        width: 100% !important;
        height: 100% !important;
        background-color: black;

  <body>
    <div id="theatre-ia-wrap" class="js-playset-list">
      <div id="theatre-ia">
        
        <!-- Emulator Controls (Fullscreen & Mute) -->
        <div id="theatre-controls">
          <a href="#" id="gofullscreen" aria-label="Fullscreen view">
            <div class="iconochive-fullscreen js-emulation-fullscreen" title="fullscreen view"></div>
          </a>
          <a href="#" class="js-play8-mute-click js-emulation-mute-click" aria-label="Click to mute">
            <div class="iconochive-unmute" style="display:none" title="sound is on. click to mute sound."></div>
          </a>
          <a href="#" aria-label="Click for sound">
            <div class="iconochive-mute js-play8-mute-click js-emulation-mute-click" style="display:none" title="sound is off. click for sound."></div>
          </a>
        </div>

        <!-- Emulator Start Screen & Canvas -->
        <div id="emulate">
          <center class="posrel">
            <a id="jsmessSS" href="#loading" class="js-emulation-emulate">
              <div id="screenshot">
                <img src="https://archive.org/serve/pokemon-emerald-version_202308/pokemon-emerald-version_202308_screenshot.gif" alt="[screenshot]"/>
              </div>
              <img class="ghost" src="https://archive.org/images/start.png" title="Click to Begin">
            </a>
            <div id="canvasholder">
              <canvas id="canvas" style="width:560px;height:384px"></canvas>
              <div id="gamepadtext"></div>
            </div>
          </center>
        </div>

      </div>
    </div>

    <!-- Hidden Configuration Input Required by emulation.min.js -->
    <input class="js-emulation" type="hidden" value='{"url":"https://archive.org/stream/pokemon-emerald-version_202308?module=gba","identifier":"pokemon-emerald-version_202308","module":"gba","screenshot":"https://archive.org/serve/pokemon-emerald-version_202308/pokemon-emerald-version_202308_screenshot.gif"}'/>
